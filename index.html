<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI-powered solutions</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;600&display=swap');

  :root{
    --ink:#12151a;
    --paper:#eef0f2;
    --line:#c7ccd3;
    --signal:#3a5cff;
    --human:#c23b3b;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
  }

  header{
    display:block;
    max-width:920px;
    margin:0 auto;
    padding:80px 24px 40px;
    border-bottom:1px solid var(--ink);
  }

  header title{ display:none; }

  h1{
    margin:0 0 14px;
    font-size:clamp(28px, 5vw, 46px);
    font-weight:700;
    letter-spacing:-0.02em;
    line-height:1.15;
    max-width:14ch;
  }

  header p.tag{
    margin:0;
    font-size:14px;
    color:#565d68;
    max-width:46ch;
    line-height:1.6;
  }

  header p.tag::before{
    content:"//";
    color:var(--signal);
    margin-right:8px;
  }

  main{
    max-width:920px;
    margin:0 auto;
    padding:64px 24px 120px;
    position:relative;
  }

  .card{
    border:1px solid var(--ink);
    background:#fff;
    padding:28px;
    max-width:480px;
  }

  .card .label{
    font-size:11px;
    color:#8a9099;
    margin-bottom:10px;
  }

  .card .stat{
    font-size:34px;
    font-weight:700;
    color:var(--signal);
  }

  .intrusion{
    position:relative;
    margin:56px auto 0;
    max-width:520px;
    transform:rotate(-1.4deg);
  }

  .intrusion h2{
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size:52px;
    color:var(--human);
    margin:0;
    padding:18px 26px;
    background:#fffbe6;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.08);
    border:1px solid rgba(0,0,0,0.06);
    display:inline-block;
  }

  .intrusion::before{
    content:"";
    position:absolute;
    top:-14px; left:34px;
    width:60px; height:22px;
    background:rgba(0,0,0,0.08);
    transform:rotate(-4deg);
  }

  footer{
    max-width:920px;
    margin:0 auto;
    padding:0 24px 60px;
    font-size:12px;
    color:#9298a1;
  }

  @media (max-width:560px){
    header{ padding:56px 20px 32px; }
    main{ padding:48px 20px 96px; }
    .intrusion h2{ font-size:38px; }
  }

  @media (prefers-reduced-motion: reduce){
    * { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <title>AI-powered solutions</title>
  <h1>Instantly accessible, always accurate, fully customizable.</h1>
  <p class="tag">Deployed in minutes. Scales with you. No integration required.</p>
</header>

<main>
  <div class="card">
    <div class="label">UPTIME</div>
    <div class="stat">99.98%</div>
  </div>

  <div class="intrusion">
    <h2>William, I miss you</h2>
  </div>
</main>

<footer>
  built for whoever needed to read that today
</footer>

</body>
</html>
